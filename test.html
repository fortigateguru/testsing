  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0b1220;color:#e6ebff}
    header{padding:16px 20px;background:#0f1a32;border-bottom:1px solid #1e2a44}
    h1{margin:0;font-size:22px}
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    .card{background:#101a33;border:1px solid #1e2a44;border-radius:12px;padding:24px;margin-bottom:20px}
    iframe{width:100%;height:480px;border:0;border-radius:12px}
    .warn{background:#2e1a1a;border:1px solid #5b2a2a;color:#ffdede;padding:10px 12px;border-radius:10px;margin-bottom:20px}
    button{padding:12px 24px;background:#2b5cff;border:0;color:white;font-weight:600;font-size:16px;border-radius:10px;cursor:pointer;margin-top:16px}

<body>

<header>
  <h1>דמו מתקפת Open Redirect – תצוגה חינוכית</h1>
</header>

<div class="wrap">

  <div class="card">
    <h2>1) שלב ההטעיה – הצגת אתר "לגיטימי"</h2>
    <div class="warn">הערה: זו הדגמה בלבד. התוכן למטה מוטמע באמצעות iframe ואינו בשליטתנו.</div>
    <iframe src="https://mod.gov.il/" title="אתר לגיטימי"></iframe>
  </div>

  <div class="card">
    <h2>2) שלב ההפניה – מעבר ליעד זדוני</h2>
    <p>כאן התוקף מחכה כמה שניות ואז מפנה את המשתמש ליעד אחר (למשל דף התחברות מזויף או קובץ זדוני).</p>
    <button id="redirectBtn">לחץ להמחשת הפניה מזויפת</button>
  </div>

</div>

<script>
document.getElementById("redirectBtn").addEventListener("click", function() {
  window.location.href = "https://www.ynet.co.il";
});
</script>

</body>
